# XcodeGen spec — run `xcodegen generate` (brew install xcodegen) to produce WeWere.xcodeproj.
# The .xcodeproj is committed too, so a plain `xcodebuild` works without XcodeGen installed.
name: WeWere
options:
  bundleIdPrefix: com.rollapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  xcodeVersion: "26.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.19.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.0.0
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: 8.12.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SUPPORTS_MACCATALYST: "NO"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

targets:
  WeWere:
    type: application
    platform: iOS
    sources:
      - path: WeWere
        excludes:
          - "Resources/*.example.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rollapp.shared
        PRODUCT_NAME: WeWere
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: "4"
        INFOPLIST_FILE: WeWere/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: "YES"
        OTHER_LDFLAGS: "-ObjC"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Kingfisher
        product: Kingfisher
    postBuildScripts:
      # Google Sign-In returns to the app through a URL scheme equal to the
      # REVERSED_CLIENT_ID in GoogleService-Info.plist. That file is git-ignored, so
      # the scheme is read from it at build time rather than committed in Info.plist.
      - name: Register Google Sign-In URL scheme
        shell: /bin/sh
        script: |
          PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          GS="$SRCROOT/WeWere/Resources/GoogleService-Info.plist"
          RID=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" "$GS" 2>/dev/null) || exit 0
          [ -n "$RID" ] || exit 0
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleTypeRole string Editor" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes array" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes:0 string $RID" "$PLIST"
          echo "Registered URL scheme $RID"
        basedOnDependencyAnalysis: false

schemes:
  WeWere:
    build:
      targets:
        WeWere: all
    run:
      config: Debug
    archive:
      config: Release
