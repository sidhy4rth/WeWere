name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # google-services.json is git-ignored because it names a real Firebase project.
      # The committed template is enough for the build to compile and for the unit
      # tests, which never touch a network.
      - name: Provide Firebase config template
        run: cp app/google-services.json.example app/google-services.json

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  rules:
    name: Firestore security rules
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The Firestore emulator is a JVM process.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json

      - name: Install
        working-directory: rules-tests
        run: npm ci

      - name: Run rules tests against the emulator
        working-directory: rules-tests
        run: npx firebase emulators:exec --only firestore --project roll-rules-test "node run.mjs"
